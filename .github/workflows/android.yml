name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Python 3.11
      run: |
        # Сначала устанавливаем software-properties-common (он нужен для add-apt-repository)
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        
        # Теперь можно использовать add-apt-repository
        sudo add-apt-repository ppa:deadsnakes/ppa -y
        sudo apt-get update
        sudo apt-get install -y python3.11 python3.11-dev python3.11-venv python3.11-distutils
        
        # Делаем Python 3.11 системным
        sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
        sudo update-alternatives --set python3 /usr/bin/python3.11
        
        # Устанавливаем pip
        curl -sS https://bootstrap.pypa.io/get-pip.py | sudo python3
        
        python3 --version
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          libncursesw5-dev libtinfo5 \
          cmake libffi-dev libssl-dev \
          libsqlite3-dev libbz2-dev liblzma-dev \
          libgdbm-dev libdb-dev locales
    
    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade buildozer cython
    
    - name: Build APK
      run: |
        python3 -m buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk