name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            openjdk-17-jdk \
            autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Pre-download freetype from mirrors
        run: |
          D=.buildozer/android/platform/build-arm64-v8a/packages/freetype
          mkdir -p "$D"
          curl -fL --retry 3 --retry-delay 5 -o "$D/freetype-2.14.1.tar.gz" "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz" \
            || curl -fL --retry 3 --retry-delay 5 -o "$D/freetype-2.14.1.tar.gz" "https://ftp.osuosl.org/pub/blfs/conglomeration/freetype/freetype-2.14.1.tar.gz" \
            || curl -fL --retry 3 --retry-delay 5 -o "$D/freetype-2.14.1.tar.gz" "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"
          
          if [ -s "$D/freetype-2.14.1.tar.gz" ]; then
            touch "$D/.mark-freetype-2.14.1.tar.gz"
            echo "✅ Freetype successfully downloaded!"
            ls -la "$D"
          else
            echo "❌ ERROR: freetype download failed from all mirrors"
            exit 1
          fi
      - name: Restore signing keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
          ls -la ~/.android
      - name: Build APK
        run: |
          buildozer android debug
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk