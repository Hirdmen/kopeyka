name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build APK with Docker
      run: |
        docker run --rm \
          -v $(pwd):/app \
          -v ~/.buildozer:/home/user/.buildozer \
          -w /app \
          kivy/buildozer:latest \
          buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: bin/*.apk